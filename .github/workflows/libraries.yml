name: libraries

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-libs:
    name: Python libs (auth, policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: nostrhost-auth tests
        working-directory: libs/nostrhost-auth
        run: uv sync --all-groups && uv run pytest -q

      - name: nostrhost-policy tests
        working-directory: libs/nostrhost-policy
        run: uv sync --all-groups && uv run pytest -q

  go-libs:
    name: Go ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: catalog lib
            dir: libs/nostrhost-catalog
          - name: nsite gateway (nostrhost-nsite)
            dir: libs/nostrhost-nsite
            build_cmd: ./cmd/nostrhost-nsite
          - name: control plane (nostrhost-control)
            dir: libs/nostrhost-control
            build_cmd: ./cmd/nostrhost-control
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod

      - name: go test
        working-directory: ${{ matrix.dir }}
        run: go test ./...

      - name: go build
        if: matrix.build_cmd
        working-directory: ${{ matrix.dir }}
        run: go build -buildvcs=false ${{ matrix.build_cmd }}

  fork-identity:
    name: Fork identity layer (Phase 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -q pytest nostr-sdk websockets httpx2 fastapi uvicorn PyJWT typer \
            tomli-w pyyaml jinja2 packaging passlib cryptography publicsuffix2 \
            psutil dnspython python-debian email-validator pyopenssl
          pip install -q -e libs/nostrhost-auth
          pip install -q -e libs/nostrhost-policy

      - name: Run nostr identity tests (fork, nostrhost branch)
        working-directory: forks/yunohost
        env:
          PYTHONPATH: src:../../libs/nostrhost-policy/src:../../libs/nostrhost-auth/src
        run: python -m pytest -c /dev/null tests_nostr/ -q

      - name: Verify the agent operation-catalogue snapshot is current
        # The resident agent embeds a generated catalogue + digest; if this
        # check fails, regenerate it against the pinned fork source:
        #   python libs/nostrhost-agent/scripts/generate_operation_registry.py \
        #     --fork-src forks/yunohost/src \
        #     --output libs/nostrhost-agent/agent/catalog_generated.go
        # A stale digest makes nostr-operationsd reject every request with
        # `catalog_digest_mismatch` (and any later approval becomes a no-op).
        run: |
          python libs/nostrhost-agent/scripts/generate_operation_registry.py \
            --fork-src forks/yunohost/src \
            --output libs/nostrhost-agent/agent/catalog_generated.go \
            --check
