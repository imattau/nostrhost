name: libraries

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-libs:
    name: Python libs (auth, policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: nostrhost-auth tests
        working-directory: libs/nostrhost-auth
        run: uv sync --all-groups && uv run pytest -q

      - name: nostrhost-policy tests
        working-directory: libs/nostrhost-policy
        run: uv sync --all-groups && uv run pytest -q

  catalog-lib:
    name: Go catalog lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: libs/nostrhost-catalog/go.mod

      - name: go test
        working-directory: libs/nostrhost-catalog
        run: go test ./...

  control-lib:
    name: Go control plane (nostrhost-control)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version-file: libs/nostrhost-control/go.mod

      - name: go test
        working-directory: libs/nostrhost-control
        run: go test ./...

      - name: go build
        working-directory: libs/nostrhost-control
        run: go build -buildvcs=false ./cmd/nostrhost-control

  fork-identity:
    name: Fork identity layer (Phase 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -q pytest coincurve nostr-sdk websockets bottle PyJWT typer \
            toml pyyaml requests jinja2 packaging passlib cryptography publicsuffix2 \
            psutil dnspython python-debian email-validator pyopenssl
          pip install -q -e libs/nostrhost-auth
          pip install -q -e libs/nostrhost-policy

      - name: Run nostr identity tests (fork, nostrhost branch)
        working-directory: forks/yunohost
        env:
          PYTHONPATH: src:../../libs/nostrhost-policy/src:../../libs/nostrhost-auth/src
        run: python -m pytest -c /dev/null tests_nostr/ -q