[app]
id = "example"
version = "1.2.0"

[source.main]
url = "https://example.org/releases/example-1.2.0.tar.gz"
sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

[runtime]
type = "node"
version = "24"

[packages]
apt = ["ffmpeg", "imagemagick"]

[user]
system = true

[directories.install]
path = "/opt/example"

[directories.data]
path = "/var/lib/example"
backup = true

[service]
exec = "/opt/example/bin/server"
working_directory = "/var/lib/example"

[service.environment]
NODE_ENV = "production"

[web]
upstream = "127.0.0.1:8090"
auth = "nostrhost"
https = "automatic"

[health]
type = "http"
path = "/health"

[policies.example-auth-bf]
type = "crowdsec"
name = "example-auth-bf"
content = """
type: leaky
name: example/example-auth-bf
description: "Example app login brute-force"
filter: "evt.Meta.log_type == 'http_access-log' && evt.Parsed.http_verb == 'POST' && evt.Parsed.http_path == '/login'"
leakspeed: 60s
capacity: 10
groupby: evt.Meta.source_ip
"""

[policies.example-login-bf]
type = "crowdsec"
name = "example-login-bf"
content = """
type: leaky
name: example/example-login-bf
description: "Example app account enumeration guard"
filter: "evt.Meta.log_type == 'http_access-log' && evt.Parsed.http_status == '401'"
leakspeed: 30s
capacity: 20
groupby: evt.Meta.source_ip
"""
