# Native package declaration for the Opencode web interface (W3 real-app port).
#
# Opencode (https://github.com/anomalyco/opencode) is the AI coding agent; its
# CLI ships a web server (`opencode serve`). We package the prebuilt release
# binary and run it behind the Caddy route with NostrHost auth, a health check
# and a Restic backup of its data directory. The `_nh` tail marks this as a
# NostrHost-native package (YunoHost's convention is `_ynh`).
#
# `installation_class = "multi-tenant-runtime"`: opencode has no internal
# multi-user support - every member hitting one shared `opencode serve`
# process would share its $HOME, config, API token, and session/history. The
# binary under /opt/opencode-web stays a single shared install (identical for
# every user, so duplicating it per member would be pure waste), but each
# member gets their own OS identity, small state directory, and process,
# spawned on first connection and reaped when idle. See
# docs/ROLE-AND-APP-ACCESS-DESIGN.md for the installation_class design.
#
# Distribute as an .npk artifact (npack; see docs/dev/native-app-packages.md):
# no [source] changes needed - npack signs/transports this manifest, not the
# payload bytes, so the [source.app] URL+SHA-256 fetch below still runs
# unchanged at install-apply time via the resource engine's own
# SourceProvider. --version is required because [app].version below carries
# a YunoHost-style `~nh1` packaging-revision suffix, which isn't valid
# SemVer (npack requires it); [app].version stays the string the upgrade
# gate compares against, independent of the npk release version.
#
#   cargo build --release --manifest-path forks/npack/Cargo.toml
#   NPACK_BIN="$PWD/forks/npack/target/release/npack" \
#   nostrhost-package build-npk package.toml \
#     --output opencode-web_nh-1.18.30.npk \
#     --publisher <npub-or-hex> --version 1.18.30

installation_class = "multi-tenant-runtime"

[app]
id = "opencode-web_nh"
# ~nh<N> is a packaging-only revision suffix (YunoHost's convention is
# ~ynh<N>): the upstream binary/source below is unchanged, but the app
# lifecycle's upgrade gate compares this string for equality against the
# installed version (app_management.py) and refuses to upgrade otherwise -
# bump this whenever a packaging-only fix (like this one) needs `app
# upgrade opencode-web_nh` to actually apply it.
version = "1.18.30~nh1"

[source.app]
url = "https://github.com/anomalyco/opencode/releases/download/v1.18.30/opencode-linux-x64.tar.gz"
sha256 = "55007246858165496ff85ba1c2b648f7421e8e2013bf4189a680c9ff8e699d17"
extract = true
destination = "/opt/opencode-web"

[directories.install]
path = "/opt/opencode-web"
mode = 0o755

[runtime_instance]
# %i is the per-connection username (systemd's template instance specifier);
# every *_env below points at that same per-user state directory so
# instances never share config, provider tokens, session history, or
# project/repo storage.
#
# Confirmed against the real opencode CLI (anomalyco/opencode, packages/cli/
# src/commands/handlers/serve.ts + packages/web/src/content/docs/server.mdx):
# `opencode serve` only ever binds a TCP `--hostname`/`--port` pair - there is
# no socket flag and no fd-inheritance/socket-activation support. So the
# instance itself binds a plain, fixed TCP port, but `PrivateNetwork=yes`
# (see RuntimeInstanceTemplateProvider) isolates it into its own loopback
# namespace - every instance can safely reuse the same internal_port with no
# cross-instance collision. Caddy still only ever dials the Unix socket in
# socket_path_template; a paired `opencode-web-bridge@.service`
# (systemd-socket-proxyd, rendered automatically) forwards from that socket
# into this instance's private loopback port.
#
# `config_dir_env` alone is NOT enough: per opencode's own source
# (packages/core/src/global.ts), OPENCODE_CONFIG_DIR only overrides
# Path.config. Path.data/Path.cache/Path.state - and critically Path.repos,
# where "open project" actually clones/caches project repos - are derived
# from XDG_DATA_HOME/XDG_CACHE_HOME/XDG_STATE_HOME instead (falling back to
# $HOME only if those are unset). Without data_dir_env/cache_dir_env/
# state_dir_env set here, every instance's projects could resolve to the
# same shared fallback location.
exec = "/opt/opencode-web/opencode serve --hostname 127.0.0.1 --port 35353"
state_directory = "opencode-web"
socket_path_template = "/run/opencode-web/%i.sock"
internal_port = 35353
home_env = "HOME"
config_dir_env = "OPENCODE_CONFIG_DIR"
data_dir_env = "XDG_DATA_HOME"
cache_dir_env = "XDG_CACHE_HOME"
state_dir_env = "XDG_STATE_HOME"
idle_timeout_seconds = 900
cpu_quota_percent = 100
memory_max_mb = 1024

[runtime_instance.security]
# ProtectSystem=strict is the default; DynamicUser + StateDirectory give each
# instance its own writable /var/lib/opencode-web/<user>, nothing else.
read_write_paths = []

[web]
domain = "opencode.nostrhost.test"
path = "/"
auth = "nostrhost"
route_mode = "per-user-socket"
# opencode's own backend (`opencode serve`) has no base-path/subpath option
# at all - its bundled UI always references absolute root paths, so it can
# never share a domain with another app. Confirmed live: installed at
# /opencode it 404'd on every asset.
full_domain = true

[permissions.main]
url = "/"
allowed = ["all_users"]
auth_request = true

[health]
# No single fixed backend to GET anymore (each member has their own process,
# spawned on demand) - the socket template being enabled and listening is the
# app-agnostic liveness signal instead.
type = "socket"

[backup]
paths = ["/var/lib/opencode-web"]
database = false
