# Native package declaration for the NostrHost test app (W3 app lifecycle).
#
# Fully self-contained: the web content is rendered as a managed config file
# (no network source), the app declares its web route, Portal permission,
# HTTP health check and Restic backup paths so the W3 signed loop exercises
# every step: fetch -> verify -> plan -> signed request -> policy -> approval
# -> Caddy route -> permissions -> health -> Restic pre/post state.

[app]
id = "nostrhost-test"
version = "0.1"

[directories.install]
path = "/var/www/nostrhost-test"
mode = 0o755

[config.index]
destination = "/var/www/nostrhost-test/index.html"
mode = 0o644
content = """<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>nostrhost-test</title></head>
<body><h1>nostrhost-test ok</h1><p>served natively by the resource engine</p></body>
</html>
"""

[web]
domain = "nostrhost.test"
path = "/nostrhost-test/"
file_root = "/var/www/nostrhost-test"
auth = "nostrhost"
https = "automatic"

[permissions.main]
# Relative to the app's [web] path (permission_create prepends
# domain + web.path); "/" -> nostrhost.test/nostrhost-test
url = "/"
allowed = ["all_users"]
auth_request = true

[health]
type = "http"
path = "/nostrhost-test/"
timeout = 5
retries = 2

[backup]
paths = ["/var/www/nostrhost-test"]
database = false