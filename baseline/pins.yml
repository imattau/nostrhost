# nostrhost fork baseline pins
#
# Authoritative record of which YunoHost component, at which upstream stable
# ref, each nostrhost fork is pinned to. The umbrella commits these exact
# commits as git submodule pointers under forks/.
#
# "live_server" is the version the connected YunoHost MCP servers report and
# must match the pin (the derivative baseline must behave identically to it).
#
# pins are upstream "debian/<x>" release tags (the tags the stable apt
# pipeline ships from). Forks are git forks of the upstream repos, held
# source-identical at these refs until the derivative intentionally changes
# behaviour.

version: 1

# Components forked under imattau and held as submodules under forks/.
# `derivative: true` marks a fork that has diverged from upstream onto its
# own branch (roadmap Phase 3 onwards): verify-clean reports expected
# divergence instead of failing source-identity.
forks:
  - component: yunohost        # core server-management engine (python)
    upstream_repo: YunoHost/yunohost
    fork_repo: imattau/nostrhost-yunohost
    path: forks/yunohost
    upstream_branch: dev
    branch: nostrhost          # derivative branch (first fork modification, Phase 3)
    derivative: true
    pin: debian/12.1.41.2      # upstream baseline the branch was cut from
    pin_commit: 652f93bf5518e830b56d37be4827dd975ad92246
    live_server: 12.1.41.2

  - component: portal          # Nuxt/Vue/TypeScript user portal
    upstream_repo: YunoHost/yunohost-portal
    fork_repo: imattau/nostrhost-portal
    path: forks/portal
    upstream_branch: dev
    branch: dev               # Nostr (NIP-07) login page + Tailwind/shadcn-vue redesign (PR #1)
    derivative: true
    pin: debian/12.1.2
    pin_commit: 8d77219f234042b08e670fa3df57a10d8b192461
    live_server: 12.1.2

  - component: admin           # Vue/Vite/TypeScript admin interface
    upstream_repo: YunoHost/yunohost-admin
    fork_repo: imattau/nostrhost-admin
    path: forks/admin
    upstream_branch: dev
    branch: dev               # Tailwind/shadcn-vue redesign (app shell, PR #1)
    derivative: true
    pin: debian/12.1.15
    pin_commit: 30cc34a2c3d94513487e2c1b8d0005dcdc276168
    live_server: 12.1.15

  - component: installer       # Debian ISO graphical installer image builder
    upstream_repo: YunoHost/custom-debian-iso
    fork_repo: imattau/nostrhost-custom-debian-iso
    path: forks/installer
    upstream_branch: main
    branch: main
    derivative: true
    pin: baf6e1bc2abac7d64f9d86a0f5228f1e5819d738
    pin_commit: 779be40aec1ac7fed0621a59b36257356c662bf3
    live_server: 12.1.41.2

# Upstream dependencies pinned by the same stable tags, but NOT forked in
# Stage 1 (the derivative builds against upstream versions of these).
dependencies: []

# Reusable component libraries (Stage 2: extracted from the reference
# implementations, which remain operational on stock YunoHost during the
# migration). Held as submodules under libs/; pinned to their main HEAD
# while under active development, and re-pinned to release tags later.
libraries:
  - component: auth            # identity/challenge/verify/npub/mappings/relays/NIP-05/web
    repo: imattau/nostrhost-auth
    path: libs/nostrhost-auth
    branch: main
    pin_commit: a168c3d6e454348294fdb4bad0ad608aa1208d90
    extracted_from: imattau/yunohost-nostr-auth

  - component: policy          # roles/scopes/NIP-98/delegation/approvals/owner/audit
    repo: imattau/nostrhost-policy
    path: libs/nostrhost-policy
    branch: main
    pin_commit: de0ea202db8032d30eab9f5e629aa02678b4b4cb
    extracted_from: imattau/yunohost-mcp

  - component: catalog         # catalogue event schema/relay/publisher/attestation/trust/repository
    repo: imattau/nostrhost-catalog
    path: libs/nostrhost-catalog
    branch: main
    pin_commit: 45351cb9dc44abd9c691de836ff48482d83fba3b

  - component: control         # control plane: local relay + event model (Phase 2)
    repo: imattau/nostrhost-control
    path: libs/nostrhost-control
    branch: main
    pin_commit: 5fa6588252366045ab5ddcdc600221ae52176cde
    stack: khatru-based Go relay (NIP-11/42/77/86/98)
    event_protocol: libs/nostrhost-control/EVENT-PROTOCOL.md
    selection: docs/RELAY-SELECTION.md

  - component: agent           # policy-bound local administrator and audited cycle engine
    repo: imattau/nostrhost-agent
    path: libs/nostrhost-agent
    branch: main
    pin_commit: 764bcc829e848fdaf172a71f45864282d2e27f91
    stack: Go

  - component: yunohost-mcp    # FROZEN reference implementation (MCP transition §2, docs/MCP-TRANSITION.md)
    repo: imattau/yunohost-mcp
    path: libs/yunohost-mcp
    branch: master
    pin_commit: 51fc2e7b231b281dfd82bc3cf91d8197d15cdd78
    frozen: true               # no new platform logic; feature inventory + migration base only

  - component: mcp              # thin MCP protocol adapter (MCP transition Phase 1, docs/MCP-TRANSITION.md)
    repo: imattau/nostrhost-mcp
    path: libs/nostrhost-mcp
    branch: main
    pin_commit: 1378850c1f5a1234c8341b3751400a3ca299e1f1
    stack: Python (mcp SDK v2)
