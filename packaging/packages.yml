# packages.yml — the nostrhost APT release BOM.
#
# This file is the authoritative manifest for the APT packages NostrHost
# ships. It lives in the umbrella repo because the umbrella owns dependency /
# version pins and packaging metadata (see baseline/pins.yml). Each entry maps
# an APT binary package to the Git repository that produces it.
#
# The repository is served from GitHub Pages (see .github/workflows/apt.yml):
#
#     deb [signed-by=/etc/apt/keyrings/nostrhost.asc] \
#         https://imattau.github.io/nostrhost/debian/ bookworm main
#
# Design rules:
#   - One binary package per independently-releasable component. Two binaries
#     sourced from the same Git repo (control/notify) are separate entries and
#     are versioned independently via their own release tags.
#   - Version constraints are conservative: prefer `>=` and add a `Breaks` only
#     on a known protocol/ABI incompatibility (see compatibility.yml).
#   - `nostrhost` and `nostrhost-core-system` are meta-packages (kind: meta);
#     they are generated, not built from source.
#   - Components with their own upstream Debian packages (crowdsec,
#     nftables, slapd, Python system libs, ...) are external Depends, never
#     repackaged here.

version: 1

# Repository layout served on GitHub Pages.
repository:
  codename: bookworm
  components: [main]
  architectures: [amd64]
  origin: nostrhost
  label: nostrhost
  base_url: https://imattau.github.io/nostrhost/debian

# Version used for the generated meta-packages until a real release process
# bumps it (overridable via the META_VERSION env in CI).
meta_version: "0.1.0"

packages:
  # ---------------------------------------------------------------- metas ----
  - name: nostrhost
    kind: meta
    summary: NostrHost — complete self-hosting server (meta-package)
    depends:
      - nostrhost-core-system
      - nostrhost-admin
      - nostrhost-portal
      - nostrhost-notify

  - name: nostrhost-core-system
    kind: meta
    summary: NostrHost — minimal headless system (meta-package)
    depends:
      - nostrhost-core
      - python3-nostrhost
      - nostrhost-control
      - nostrhost-catalog
      - nostrhost-caddy
      - nostrhost-security-config
      - python3-nostrhost-auth
      - python3-nostrhost-policy
      - nostrhost-runtime

  # ------------------------------------------------------------- core ------
  # The fork's debian/ tree ships the engine as `nostrhost-core` (Stage 2 of
  # the core rename — see compatibility.yml core_rename). It Provides/
  # Replaces/Conflicts the historical `yunohost` name; a transitional empty
  # `yunohost` package depends on it so existing installs keep resolving.
  - name: nostrhost-core
    kind: debian-source
    source:
      repo: imattau/nostrhost-yunohost
      submodule: forks/yunohost
      binary_package: nostrhost-core     # Stage 2: renamed from `yunohost`
    summary: NostrHost server-management engine (renamed from yunohost)
    depends:
      - python3-nostrhost
      - python3-nostrhost-auth
      - python3-nostrhost-policy
      - nostrhost-caddy
      - nostrhost-security-config
      - nftables
      - slapd
    provides:
      - yunohost
    conflicts:
      - yunohost (<< 12.1.41.5)
    replaces:
      - yunohost (<< 12.1.41.5)
    recommends:
      - nostrhost-admin
      - nostrhost-portal

  # Transitional package for the yunohost -> nostrhost-core rename: depends on
  # the new core so old references to `yunohost` keep resolving. Ships from
  # the same debian/ tree as nostrhost-core.
  - name: yunohost
    kind: debian-source
    source:
      repo: imattau/nostrhost-yunohost
      submodule: forks/yunohost
      binary_package: yunohost
    built_with: nostrhost-core       # excluded from the build matrix
    summary: Transitional package (core renamed to nostrhost-core)
    depends:
      - nostrhost-core (>= 12.1.41.5)
    provides: []
    conflicts: []
    replaces: []
    breaks: []

  # python3-nostrhost — the native moulinette replacement (framework + CLI +
  # API), built from the same debian/ tree as nostrhost-core. Not a separate
  # matrix job: it is produced by the nostrhost-core dpkg-buildpackage step.
  #
  # Its binary Depends also includes `yunohost` (nostrhost.cli/api import
  # yunohost.nostr_operations etc.), but that back-edge is omitted here to
  # keep the manifest graph acyclic — the real dependency lives in the fork's
  # debian/control.
  - name: python3-nostrhost
    kind: debian-source
    source:
      repo: imattau/nostrhost-yunohost
      submodule: forks/yunohost
      binary_package: python3-nostrhost
    built_with: nostrhost-core       # excluded from the build matrix
    summary: Native nostrhost framework — moulinette replacement (primitives + Typer CLI + Bottle/NIP-98 API)
    depends:
      - python3-typer
      - python3-bottle
      - python3-requests
      - python3-nostrhost-auth

  # ------------------------------------------------------------ runtime ----
  # Private Python runtime venv (/opt/nostrhost/venv, --system-site-packages).
  # Bundles pinned manylinux cp311 wheels for the pip-only deps (nostr-sdk
  # and pydantic v2 — none in bookworm, or only as v1) and
  # installs them offline via postinst. Daemons/units run on the venv python.
  # The wheel set is downloaded at build time (not committed); when
  # packaging/runtime/requirements.txt changes, bump the version here.
  - name: nostrhost-runtime
    kind: runtime
    version: "0.1.3"
    summary: NostrHost Python runtime venv (bundled manylinux cp311 wheels)
    depends:
      - python3-venv
      - python3-pip
    source:
      requirements: packaging/runtime/requirements.txt
    provides: []
    breaks: []

  # ------------------------------------------------------------ control ----
  # Two independently-versioned binaries from one Git repo. The release flow
  # tags them separately (control/vX.Y.Z, notify/vX.Y.Z) so APT treats them as
  # independent packages even though they share a source repository.
  - name: nostrhost-control
    kind: golang
    version: "0.1.1"                     # agent writer allowlist reconciliation
    source:
      repo: imattau/nostrhost-control
      submodule: libs/nostrhost-control
      cmd: ./cmd/nostrhost-control
      systemd: nostrhost-control.service
    summary: NostrHost control-plane relay (local khatru relay)
    depends:
      - nostrhost-core
    provides: []
    breaks: []

  - name: nostrhost-notify
    kind: golang
    version: "0.1.0"                     # from tag notify/v0.1.0 in CI
    source:
      repo: imattau/nostrhost-control
      submodule: libs/nostrhost-control
      cmd: ./cmd/nostrhost-notify
      systemd: nostrhost-notify.service
    summary: NostrHost NIP-17/59 notification daemon
    depends:
      - nostrhost-control (>= 0.1)
      - nostrhost-core
    provides: []
    breaks: []

  - name: nostrhost-catalog
    kind: golang
    version: "0.1.0"
    source:
      repo: imattau/nostrhost-catalog
      submodule: libs/nostrhost-catalog
      cmd: ./cmd/nostrhost-catalog
      systemd: nostrhost-catalog.service
    summary: NostrHost catalogue resolver/service
    depends:
      - nostrhost-control (>= 0.1)
    provides: []
    breaks: []

  # Optional resident assistant. It is deliberately absent from both meta-
  # packages until its provisioning and operational lifecycle is mature.
  - name: nostrhost-agent
    kind: golang
    version: "0.1.0"
    source:
      repo: imattau/nostrhost-agent
      submodule: libs/nostrhost-agent
      cmd: ./cmd/nostrhost-agent
      systemd: nostrhost-agent.service
      maintainer_scripts:
        postinst: deploy/postinst
        prerm: deploy/prerm
        postrm: deploy/postrm
    summary: Optional NostrHost agent daemon (disabled until explicitly configured)
    depends:
      - adduser
      - init-system-helpers
      - nostrhost-control
      - systemd
    provides: []
    breaks: []

  # -------------------------------------------------------- python libs ----
  - name: python3-nostrhost-auth
    kind: python
    version: "0.1.0"
    source:
      repo: imattau/nostrhost-auth
      submodule: libs/nostrhost-auth
    summary: NostrHost authentication/identity library
    # Runtime python deps (nostr-sdk) are not in Debian bookworm and are
    # provisioned from PyPI — see packaging/README.md.
    depends: []
    provides: []
    breaks: []

  - name: python3-nostrhost-policy
    kind: python
    version: "0.1.1"
    source:
      repo: imattau/nostrhost-policy
      submodule: libs/nostrhost-policy
    summary: NostrHost authorisation/policy library
    # Runtime python deps (nostr-sdk, pydantic v2) are not available
    # in Debian bookworm (pydantic only ships v1 there) and are provisioned
    # from PyPI — see packaging/README.md.
    depends: []
    provides: []
    breaks: []

  # ------------------------------------------------------------- web SPA ----
  - name: nostrhost-admin
    kind: spa
    version: "0.1.0"
    source:
      repo: imattau/nostrhost-admin
      submodule: forks/admin
      build_dir: app
      package_manager: yarn@1.22.22
      install_args: [install, --frozen-lockfile, --non-interactive]
      build_args: [build]
      output_dir: dist
      base_path: /nostrhost/admin/
      static_dir: /usr/share/nostrhost/admin
    summary: NostrHost admin interface (built SPA assets)
    depends:
      - nostrhost-core
    recommends: []
    breaks: []

  - name: nostrhost-portal
    kind: spa
    version: "0.1.0"
    source:
      repo: imattau/nostrhost-portal
      submodule: forks/portal
      package_manager: yarn@1.22.22
      install_args: [install, --frozen-lockfile, --non-interactive]
      build_args: [generate]
      output_dir: .output/public
      static_dir: /usr/share/nostrhost/portal
    summary: NostrHost user portal (built SPA assets)
    depends:
      - nostrhost-core
    recommends: []
    breaks: []

  # -------------------------------------------------------------- caddy ----
  - name: nostrhost-caddy
    kind: caddy
    version: "2.9.1"
    source:
      xcaddy_modules:
        - github.com/mholt/caddy-l4
      systemd: caddy.service
    summary: Caddy with NostrHost modules (caddy-l4)
    depends: []
    provides:
      - caddy
    conflicts:
      - caddy
    replaces:
      - caddy
    breaks: []

  # ------------------------------------------------------------ security ---
  # CrowdSec itself is an external package; this ships only NostrHost-specific
  # acquisition/parser/scenario config on top of it.
  - name: nostrhost-security-config
    kind: config
    version: "0.1.0"
    summary: NostrHost CrowdSec acquisition/scenarios/bouncer configuration
    depends:
      - crowdsec
      - crowdsec-firewall-bouncer
    source:
      submodule: forks/yunohost
    files:
      - source: conf/crowdsec/acquis.yaml
        dest: /etc/crowdsec/acquis.d/nostrhost.yaml
      - source: conf/crowdsec/scenarios/
        dest: /etc/crowdsec/scenarios/
      - source: conf/crowdsec-firewall-bouncer/crowdsec-firewall-bouncer.yaml
        dest: /etc/crowdsec/crowdsec-firewall-bouncer.yaml
    breaks: []

# External Debian packages these entries depend on, so verify-dependencies can
# distinguish "our" packages from upstream ones. Only used for validation.
external_deps:
  - adduser
  - init-system-helpers
  - systemd
  - python3-typer
  - python3-bottle
  - python3-requests
  - python3-venv
  - python3-pip
  - crowdsec
  - crowdsec-firewall-bouncer
  - nftables
  - slapd
