scope = ""
self_service = true
schema = "authority/event-protocol/schemas/30078-app-data.schema.json"
encryption = "nip42-gated"
retention = "replaceable"
projection = "pending:WP4"
replication = "local-only"
notes = "NIP-78 application data (portal/user preferences). No producer yet."

