# NostrHost control-plane authority register (WP0).
#
# One entry per persistent control-plane fact. Exactly one authority per fact;
# see docs/dev/authority-register.md for the class model and how to add an
# entry. `tools/authority_registry.py check` fails when a persistent path
# discovered in the source tree is not covered here.
#
# class:        event | repository | secret | bootstrap | projection |
#               transactional | external
# sensitivity:  secret | private | public
# target_authority is a free-form coordinate naming the canonical source:
#   events:<kind>            a signed relay event (or chain)
#   ngit:<repo>              the semantic-state repository
#   secret-store             local root-only credential material
#   local:<role>             local bootstrap / enforcement / execution store
#   external:<owner>         state owned by Linux, YunoHost, Restic, the agent

version = 1

# ---------------------------------------------------------------------------
# Event authority
# ---------------------------------------------------------------------------

[[state]]
id = "identity-mapping"
path = "/etc/nostrhost/identity.db"
class = "projection"
owner = "forks/yunohost/src/nostr_identityd.py"
readers = [
  "forks/yunohost/src/nostr_identity.py",
  "forks/yunohost/src/nostr_login.py",
  "forks/yunohost/src/nostr_account.py",
  "forks/yunohost/src/nostrhost/api.py",
  "forks/yunohost/src/authenticators/ldap_ynhuser.py",
]
writers = ["forks/yunohost/src/nostr_identityd.py"]
sensitivity = "private"
target_authority = "events:31102"
retention = "projection; disposable, rebuilt from the relay"
recovery = "replay kind 31102 from the control relay (nostr-projector rebuild identity)"
notes = "SQLite MappingStore in libs/nostrhost-auth. Pubkey<->account authority is 31102; this file is the read model. WP3: only the event-driven projector writes it (handle_identity_event); no direct-write path remains."

[[state]]
id = "capability-projection"
path = "/var/lib/nostrhost/capabilities.json"
class = "projection"
owner = "forks/yunohost/src/nostr_capability_projection.py"
readers = [
  "forks/yunohost/src/nostr_operationsd.py",
  "forks/yunohost/src/nostrhost/api.py",
  "forks/yunohost/bin/nostr-projector",
]
writers = [
  "forks/yunohost/src/nostr_operationsd.py",
  "forks/yunohost/src/nostr_capability_projection.py",
]
sensitivity = "private"
target_authority = "events:31100"
retention = "projection; disposable, rebuilt from the relay"
recovery = "replay kinds 31100/27236/27237 from the control relay (nostr-projector rebuild capabilities)"
notes = "WP3: persisted authorization read model folding 31100 grants + 27236/27237 delegations. WP3 deliverable 2."

[[state]]
id = "capability-scopes"
path = "in-memory:OperationEngine.scopes"
class = "projection"
owner = "forks/yunohost/src/nostr_operationsd.py"
readers = ["forks/yunohost/src/nostr_operationsd.py"]
writers = ["forks/yunohost/src/nostr_operationsd.py"]
sensitivity = "private"
target_authority = "events:31100"
retention = "in-memory mirror of capability-projection"
recovery = "replay kinds 31100/27236/27237 from the control relay"
notes = "WP3: an in-process mirror of /var/lib/nostrhost/capabilities.json for the state recorder; the file is the durable authority."

[[state]]
id = "delegations"
path = "in-memory:OperationEngine.delegations"
class = "projection"
owner = "forks/yunohost/src/nostr_operationsd.py"
readers = ["forks/yunohost/src/nostr_operationsd.py"]
writers = ["forks/yunohost/src/nostr_operationsd.py"]
sensitivity = "private"
target_authority = "events:27236"
retention = "in-memory mirror of capability-projection"
recovery = "replay kinds 27236/27237 from the control relay"
notes = "WP3: mirrored into /var/lib/nostrhost/capabilities.json; the file is the durable authority."

[[state]]
id = "nip51-permission-sets"
path = "/etc/nostrhost/nip51_permissions.json"
class = "projection"
owner = "forks/yunohost/src/nostr_permissiond.py"
readers = ["forks/yunohost/src/nostrhost/permissions.py"]
writers = ["forks/yunohost/src/nostr_permissiond.py"]
sensitivity = "private"
target_authority = "events:30000"
retention = "projection; durable materialisation of accepted lists"
recovery = "replay kind 30000 permission lists from the control relay"

[[state]]
id = "operation-chain"
path = "relay:events.db"
class = "event"
owner = "libs/nostrhost-control"
readers = [
  "forks/yunohost/src/nostr_operations.py",
  "forks/yunohost/src/nostrhost/native_ops.py",
  "forks/yunohost/src/nostrhost/events.py",
]
writers = ["libs/nostrhost-control/internal/relay/server.go"]
sensitivity = "private"
target_authority = "events:chain"
retention = "immutable audit chain; long-lived"
recovery = "relay event store + state-bundle replication + Restic"
notes = "Kinds 2200-2205. No separate audit DB; queries fold the chain with WP5 bounded 'until' pagination (page_all) and signer-anomaly annotation."

[[state]]
id = "notice-events"
path = "relay:notices"
class = "event"
owner = "forks/yunohost/src/nostr_notify.py"
readers = ["libs/nostrhost-control/internal/notify/service.go"]
writers = [
  "forks/yunohost/src/nostr_login.py",
  "forks/yunohost/src/nostr_notify.py",
  "forks/yunohost/src/nostr_security.py",
  "forks/yunohost/src/nostr_operationsd.py",
]
sensitivity = "private"
target_authority = "events:2210-2213"
retention = "immutable notices; bounded retention"
recovery = "relay event store"

[[state]]
id = "state-bundle-events"
path = "relay:state-bundles"
class = "event"
owner = "forks/yunohost/src/nostr_state.py"
readers = ["forks/yunohost/src/nostr_state.py"]
writers = ["forks/yunohost/src/nostr_state.py"]
sensitivity = "private"
target_authority = "events:2214"
retention = "replication chunks; refreshed per publish"
recovery = "reconstruct the git bundle from contiguous chunks"

[[state]]
id = "state-repo-announcement"
path = "relay:30617"
class = "event"
owner = "forks/yunohost/src/nostr_state.py"
readers = ["forks/yunohost/src/nostr_state.py"]
writers = ["forks/yunohost/src/nostr_state.py"]
sensitivity = "public"
target_authority = "events:30617"
retention = "addressable; latest wins"
recovery = "re-publish from the state repository"

# ---------------------------------------------------------------------------
# Repository authority (ngit / semantic state)
# ---------------------------------------------------------------------------

[[state]]
id = "state-repository"
path = "/var/lib/nostrhost/state/**"
class = "repository"
owner = "forks/yunohost/src/nostr_state.py"
readers = [
  "forks/yunohost/src/nostr_state.py",
  "forks/yunohost/src/nostr_rollback.py",
  "forks/yunohost/src/nostrhost/native_providers.py",
]
