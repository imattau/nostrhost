  "forks/yunohost/src/nostr_state.py",
  "forks/yunohost/src/nostrhost/native_providers.py",
]
sensitivity = "private"
target_authority = "ngit:nostrhost-state"
retention = "git history; known-good tag"
recovery = "restore the repository from kind-2214 bundles or a Restic snapshot, then reconcile"
notes = "Sections: system/, domains/, apps/, services/, certificates/, identities/, package-versions/, security/, network/, notifications/, packages/, settings/, backups/, hooks/, nsites/."

[[state]]
id = "state-repo-git"
path = "/var/lib/nostrhost/state/.git"
class = "repository"
owner = "forks/yunohost/src/nostr_state.py"
readers = ["forks/yunohost/src/nostr_state.py"]
writers = ["forks/yunohost/src/nostr_state.py"]
sensitivity = "private"
target_authority = "ngit:nostrhost-state"
retention = "git object history"
recovery = "clone from a bundle or restore from Restic"
notes = "Covered by the state-repository glob; listed for clarity."

[[state]]
id = "nsite-desired-state"
path = "/var/lib/nostrhost/state/nsites"
class = "repository"
owner = "forks/yunohost/src/nostrhost/nsites/service.py"
readers = ["forks/yunohost/src/nostrhost/nsites/service.py"]
writers = ["forks/yunohost/src/nostrhost/nsites/service.py"]
sensitivity = "private"
target_authority = "ngit:nostrhost-state"
retention = "desired state; reviewable diffs"
recovery = "restore the state repository, then reconcile"
notes = "gateway.json, sites/*, domains/*. WP7 target: render nsite.toml from this."

